name: monthly refresh

on:
  schedule:
    - cron: "17 9 5 * *"   # 5th of each month, 09:17 UTC
  workflow_dispatch:
    inputs:
      since:
        description: "Earliest month to consider (YYYYMM)"
        required: false
        default: "202501"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      SINCE: ${{ github.event.inputs.since || '202501' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r pipeline/requirements.txt
      - name: Restore raw parquet from Releases (so lookups and history rebuild without re-downloading OPM)
        run: python -m pipeline.restore --since "$SINCE"
      - name: Sync new OPM months
        id: sync
        run: python -m pipeline.cli sync --since "$SINCE"
      - name: Money overview
        run: python -m pipeline.cli money
      - name: Slices and org tree
        run: python -m pipeline.cli slices
      - name: Publish parquet to Releases
        run: python -m pipeline.cli publish
      - name: Assemble site
        run: python -m pipeline.cli site
      - name: Commit data back to main
        run: |
          git config user.name "fwd-bot"
          git config user.email "fwd-bot@users.noreply.github.com"
          git add data/slices data/lookups manifest.json crosswalk
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Open an issue if the crosswalk needs review
        run: |
          python - <<'EOF'
          import json, subprocess, os
          r = json.load(open("crosswalk/review.json"))
          big = [a for a in r.get("fwd_agencies_unmapped_to_usaspending", []) if a.get("headcount", 0) > 1000]
          if big or r.get("omb_labels_without_group"):
              body = "Crosswalk review needed.\n\n" + json.dumps({"fwd_unmapped_large": big, "omb_unmapped": r.get("omb_labels_without_group")}, indent=1)
              subprocess.run(["gh", "issue", "create", "--title", "Crosswalk review needed", "--body", body, "--label", "crosswalk"], check=False)
          EOF
      - name: Open an issue on failure
        if: failure()
        run: gh issue create --title "Monthly refresh failed $(date -u +%Y-%m-%d)" --body "See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --label "pipeline" || true

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
