<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit · Fed Pulse</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23005ea2%27/%3E%3Cpath d=%27M4 18h6l3-8 5 14 4-9 2 3h4%27 fill=%27none%27 stroke=%27white%27 stroke-width=%273%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/site.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6.16/dist/plot.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
</head>
<body>
<header class="top"></header>
<main id="main">
  <div class="stage">
    <div class="nav-col">
      <details class="navfold" open>
        <summary>Find a unit</summary>
        <div id="orgnav"></div>
      </details>
    </div>
    <section id="detail" aria-live="polite">
      <div class="crumbs" id="crumbs"></div>
      <h1 id="node-title" style="margin-top:0"></h1>
      <div id="badges"></div>
      <div id="vitals"></div>
      <div id="trend"></div>
      <div id="flows"></div>
      <div id="composition"></div>
      <div id="money"></div>
      <div id="survey"></div>
      <div id="leadership"></div>
      <div id="map"></div>
      <div class="panel">
        <h2>Download and query</h2>
        <p class="muted" id="download-note"></p>
        <div id="query"></div>
      </div>
    </section>
  </div>
</main>
<footer></footer>
<script type="module">
import { loadJSON, fmt, el, qs, setQs, renderChrome } from "./js/common.js";
import * as M from "./js/measures.js";
import { renderOrgNav } from "./js/orgnav.js";
import { vitalsStrip } from "./js/vitals.js";
import { pathTo } from "./js/orgchart.js";
import { trendPanel } from "./js/trend.js";
import { flowsPanel } from "./js/flows.js";
import { compositionPanel } from "./js/composition.js";
import { mapPanel, geoFromRows } from "./js/map.js";
import { splitBar, figure } from "./js/charts.js";
import { leadershipPanel } from "./js/leadership.js";

renderChrome("unit.html");
await M.init();
const nodes = M.nodes();
const [tree, manifest] = await Promise.all([loadJSON("data/slices/orgtree.json"), loadJSON("data/manifest.json")]);

// An agency belongs to at most one overview group; money and FTE live on the group.
const groupOfAgency = {};
for (const n of Object.values(nodes)) {
  if (n.kind !== "group") continue;
  for (const a of n.members?.agencies || []) groupOfAgency[a] = n.code;
}
function groupFor(code) {
  let cur = code;
  while (cur) {
    if (groupOfAgency[cur]) return groupOfAgency[cur];
    cur = nodes[cur]?.parent;
  }
  return null;
}

let selected = qs("code", qs("g", "gov"));
if (nodes[selected]?.kind === "group") selected = nodes[selected].members?.agencies?.[0] || "gov";
if (!tree.nodes[selected]) selected = "gov";
const geoCache = new Map();

function select(code, push = false) {
  selected = code;
  setQs({ code, g: null }, !push);
  renderOrgNav(document.getElementById("orgnav"), tree, selected, (c) => select(c, true));
  renderDetail(code);
  if (push && window.innerWidth < 1000) document.getElementById("detail").scrollIntoView({ behavior: "smooth", block: "start" });
}
if (window.innerWidth < 1000) document.querySelector("details.navfold")?.removeAttribute("open");
window.addEventListener("popstate", () => { const c = qs("code", "gov"); if (tree.nodes[c]) { selected = c; renderOrgNav(document.getElementById("orgnav"), tree, selected, (x) => select(x, true)); renderDetail(c); } });

async function moneyPanel(container, code) {
  container.innerHTML = "";
  const gid = groupFor(code);
  // An agency with headcount but no obligations is usually funded outside annual appropriations rather than
  // missing from the crosswalk. Say which, instead of leaving the reader with a silent gap.
  const agencyCode = nodes[code]?.kind === "agency" ? code : nodes[code]?.parent && nodes[nodes[code].parent]?.kind === "agency" ? nodes[code].parent : code.slice(0, 2);
  const noMoney = await loadJSON("data/crosswalk/no_money.json").then((d) => d.agencies).catch(() => ({}));
  if (!gid) {
    const reason = noMoney[agencyCode];
    if (reason && nodes[code]?.kind === "agency") {
      container.append(el("div", { class: "panel" }, el("h2", {}, "Money"),
        el("p", { class: "muted" }, reason, " Headcount and the workforce measures are unaffected.")));
    }
    return;
  }
  const spec = nodes[gid];
  const snap = await M.current(gid);
  const keys = ["personnel_obligations", "contracted_services_obligations", "federal_services_obligations", "administered_obligations", "operations_obligations", "insourcing_ratio", "personnel_per_head"];
  if (!keys.some((k) => snap[k])) return;
  const panel = el("div", { class: "panel" }, el("h2", {}, "Money"));
  const isAgency = nodes[code]?.kind === "agency" || nodes[code]?.kind === "gov";
  panel.append(el("p", { class: "muted" },
    isAgency ? `USAspending direct obligations for ${spec.name}, rolling four fiscal quarters to ${snap.personnel_obligations ? M.periodLabel("quarter", snap.personnel_obligations.p) : "the latest quarter"}.`
             : `Money is reported at agency level. These figures are for ${spec.name}, the whole agency, not this unit.`));
  const cards = el("div", { class: "cards" });
  for (const k of ["personnel_obligations", "contracted_services_obligations", "insourcing_ratio", "personnel_per_head", "omb_fte"]) {
    const v = snap[k];
    if (!v) continue;
    const s = M.spec(k);
    cards.append(el("div", { class: "card", title: s.definition },
      el("div", { class: "label" }, M.defineLink(k, s.title)),
      el("div", { class: "value" }, M.formatValue(s, v.v)),
      el("div", { class: "sub" }, M.periodLabel(v.t, v.p) + (v.note ? ` · ${v.note}` : ""))));
  }
  panel.append(cards);
  const admin = snap.administered_obligations?.v, ops = snap.operations_obligations?.v;
  if (admin != null && ops != null) {
    panel.append(el("figure", {}, el("figcaption", {}, "What the agency administers versus what it runs on"),
      splitBar([{ label: "Administered", value: admin }, { label: "Operations", value: ops }])));
    const pers = snap.personnel_obligations?.v || 0, con = snap.contracted_services_obligations?.v || 0, fed = snap.federal_services_obligations?.v || 0;
    panel.append(el("figure", {}, el("figcaption", {}, "Operations detail"),
      splitBar([{ label: "Personnel", value: pers }, { label: "Contracted services", value: con }, { label: "From other agencies", value: fed }, { label: "Other operations", value: Math.max(0, ops - pers - con - fed) }])));
  }
  panel.append(el("p", { class: "muted" }, el("a", { href: `explore.html?nodes=${encodeURIComponent(gid)}&measures=personnel_obligations,contracted_services_obligations` }, "Open the money measures in the explorer")));
  container.append(panel);
}

async function surveyPanel(container, code) {
  container.innerHTML = "";
  // FEVS is published per agency; walk up to the agency this unit sits in.
  let agency = code;
  while (agency && nodes[agency]?.kind !== "agency" && nodes[agency]?.kind !== "gov") agency = nodes[agency]?.parent;
  if (!agency) return;
  const keys = ["fevs_engagement", "fevs_global_satisfaction", "fevs_leave_outside", "fevs_leave_within", "fevs_recommend", "fevs_workload_reasonable"];
  const lines = [];
  for (const k of keys) {
    const pts = await M.series(agency, k);
    if (pts.length) lines.push({ key: k, name: M.spec(k).title.replace(" (FEVS)", ""), pts });
  }
  if (!lines.length) return;
  const panel = el("div", { class: "panel" }, el("h2", {}, "Survey"));
  panel.append(el("p", { class: "muted" },
    agency === code ? "Federal Employee Viewpoint Survey, weighted percent positive. No survey was run in 2025."
                    : `Survey results are published per agency. These are for ${nodes[agency].name}, not this unit. No survey was run in 2025.`));
  const rows = lines.flatMap((L) => L.pts.map((d) => ({ ...d, series: L.name })));
  const width = Math.min(900, Math.max(300, (container.clientWidth || 700) - 30));
  const plot = Plot.plot({
    width, height: 260, marginLeft: 50,
    x: { type: "utc", label: null, tickFormat: d3.utcFormat("%Y") },
    y: { grid: true, label: "Percent positive", domain: [0, 100] },
    color: { domain: lines.map((L) => L.name), range: ["#005ea2", "#4c9a5b", "#b3261e", "#e07a3f", "#8b5fbf", "#2aa198"], legend: true },
    marks: [Plot.lineY(rows, { x: "date", y: "value", stroke: "series", strokeWidth: 2 }),
            Plot.dot(rows, { x: "date", y: "value", fill: "series", r: 3, title: (d) => `${d.series}, ${d.label}: ${d.value.toFixed(1)}%${d.n ? ` (n ${fmt.int(d.n)})` : ""}` })],
  });
  panel.append(figure("Engagement, satisfaction, and intent to leave", plot));
  panel.append(el("p", { class: "muted" }, el("a", { href: `explore.html?nodes=${encodeURIComponent(agency)}&measures=fevs_engagement,fevs_leave_outside` }, "Open the survey measures in the explorer")));
  container.append(panel);
}

async function renderDetail(code) {
  const node = tree.nodes[code];
  const crumbs = document.getElementById("crumbs");
  crumbs.innerHTML = "";
  pathTo(tree, code).forEach((c, i) => {
    const a = el("a", { href: `unit.html?code=${encodeURIComponent(c)}`, onclick: (e) => { e.preventDefault(); select(c, true); } }, tree.nodes[c].name);
    crumbs.append(i ? el("span", {}, a) : a);
  });
  document.getElementById("node-title").textContent = node.name;
  document.title = `${node.name} · Fed Pulse`;

  const badges = document.getElementById("badges");
  badges.innerHTML = "";
  badges.append(el("span", { class: "badge" }, node.level === "subelement" ? "sub-element" : node.level));
  if (node.last_seen && tree.latest && node.last_seen < tree.latest) badges.append(" ", el("span", { class: "badge warn" }, `not in OPM data since ${fmt.month(node.last_seen)}`));
  if (await M.needsQuery(code)) badges.append(" ", el("span", { class: "badge" }, "history read from the parquet in your browser"));

  vitalsStrip(document.getElementById("vitals"), { code, nodes }).catch(() => {});

  const st = { measure: qs("measure", "headcount"), by: qs("by", "none"), mode: qs("mode", "count"), cmp: qs("cmp", ""), range: qs("range", "all") };
  trendPanel(document.getElementById("trend"), {
    code, name: node.name, state: st,
    onState: (s) => setQs({ measure: s.measure === "headcount" ? null : s.measure, by: s.by === "none" ? null : s.by, mode: s.mode === "count" ? null : s.mode, cmp: s.cmp || null, range: s.range === "all" ? null : s.range }),
  });
  flowsPanel(document.getElementById("flows"), { code, name: node.name }).catch(() => {});
  compositionPanel(document.getElementById("composition"), { code, name: node.name, state: { dim: qs("dim", "grade") }, onState: (s) => setQs({ dim: s.dim === "grade" ? null : s.dim }) }).catch(() => {});
  moneyPanel(document.getElementById("money"), code).catch(() => {});
  surveyPanel(document.getElementById("survey"), code).catch(() => {});
  leadershipPanel(document.getElementById("leadership"), { code, name: node.name }).catch(() => {});

  const latest = tree.latest;
  const emp = manifest.datasets?.employment?.[latest];
  const fileUrl = emp?.site_url || emp?.release_url;
  const orgPrefix = code === "gov" ? "" : code.startsWith("D:") ? null : code;
  const geo = await loadJSON(`data/slices/geo/${code}.json`).catch(() => null);
  mapPanel(document.getElementById("map"), {
    code, name: node.name, geo,
    loadGeo: async () => {
      if (geoCache.has(code)) return geoCache.get(code);
      if (!fileUrl || orgPrefix == null) throw new Error("no parquet available for this unit");
      const { runQuery } = await import("./js/query.js");
      const duty = await loadJSON("data/lookups/duty_station.json");
      const rows = await runQuery(`SELECT duty_station_code AS code, sum(n)::BIGINT AS n FROM read_parquet('${new URL(fileUrl, location.href).href}') WHERE org_code LIKE '${orgPrefix}%' GROUP BY 1`);
      const g = geoFromRows(rows.map((r) => [r.code, r.n]), duty, latest);
      geoCache.set(code, g);
      return g;
    },
    state: { level: qs("map", "county") }, onState: (s) => setQs({ map: s.level === "county" ? null : s.level }),
  });

  const note = document.getElementById("download-note");
  note.innerHTML = "";
  note.append("Every number on this page is in ", el("a", { href: manifest.measures?.site_url || "data/measures.parquet" }, "measures.parquet"),
    ` (${fmt.money(manifest.measures?.parquet_bytes || 0)}B, ${fmt.int(manifest.measures?.rows || 0)} rows); filter on node = "${code}". `,
    el("a", { href: "catalog.html" }, "Definitions"), " · ", el("a", { href: "data.html" }, "all downloads"), ".");
  if (fileUrl) {
    const { filterPanel } = await import("./js/query.js");
    filterPanel(document.getElementById("query"), {
      fileUrl: new URL(fileUrl, location.href).href, month: latest, orgCode: orgPrefix ?? "",
      lookups: { codes: (await M.dimLabels()).codes, series: (await M.dimLabels()).series, step: (await M.dimLabels()).step, duty_station: await loadJSON("data/lookups/duty_station.json").catch(() => ({})) },
    });
  }
}

select(selected);
</script>
</body>
</html>
