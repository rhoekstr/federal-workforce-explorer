<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Org chart · Fed Pulse</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23005ea2%27/%3E%3Cpath d=%27M4 18h6l3-8 5 14 4-9 2 3h4%27 fill=%27none%27 stroke=%27white%27 stroke-width=%273%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/site.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6.16/dist/plot.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
</head>
<body>
<header class="top"></header>
<main id="main">
  <div class="stage">
    <div class="nav-col">
      <details class="navfold" open>
        <summary>Organization navigator</summary>
        <div id="orgnav"></div>
      </details>
    </div>
    <section id="detail" aria-live="polite">
      <div class="crumbs" id="crumbs"></div>
      <h1 id="node-title" style="margin-top:0"></h1>
      <div id="badges"></div>
      <div class="cards" id="cards"></div>
      <div id="trend"></div>
      <div id="flows"></div>
      <div id="composition"></div>
      <div id="map"></div>
      <div class="panel">
        <h2>Download and query</h2>
        <p class="muted" id="download-note"></p>
        <div id="query"></div>
      </div>
    </section>
  </div>
</main>
<footer></footer>
<script type="module">
import { loadJSON, fmt, el, qs, setQs, renderChrome, disclosureBadge } from "./js/common.js";
import { renderOrgNav } from "./js/orgnav.js";
import { pathTo } from "./js/orgchart.js";
import { trendPanel } from "./js/trend.js";
import { flowsChart } from "./js/flows.js";
import { compositionPanel } from "./js/composition.js";
import { mapPanel, geoFromRows } from "./js/map.js";

renderChrome("org.html");
const [tree, codes, months, manifest, series_lk, step_lk] = await Promise.all([
  loadJSON("data/slices/orgtree.json"), loadJSON("data/lookups/codes.json"), loadJSON("data/slices/months.json"), loadJSON("data/manifest.json"),
  loadJSON("data/lookups/series.json"), loadJSON("data/lookups/step.json"),
]);
const lookups = { series: series_lk, step: step_lk };
let selected = qs("code", "gov");
if (!tree.nodes[selected]) selected = "gov";
const geoCache = new Map();

function select(code, push = false) {
  selected = code;
  setQs({ code }, !push);
  renderOrgNav(document.getElementById("orgnav"), tree, selected, (c) => select(c, true));
  renderDetail(code);
  if (push && window.innerWidth < 1000) document.getElementById("detail").scrollIntoView({ behavior: "smooth", block: "start" });
}
if (window.innerWidth < 1000) document.querySelector("details.navfold")?.removeAttribute("open");
window.addEventListener("popstate", () => { const c = qs("code", "gov"); if (tree.nodes[c]) { selected = c; renderOrgNav(document.getElementById("orgnav"), tree, selected, (x) => select(x, true)); renderDetail(c); } });

async function renderDetail(code) {
  const node = tree.nodes[code];
  const crumbs = document.getElementById("crumbs");
  crumbs.innerHTML = "";
  pathTo(tree, code).forEach((c, i) => {
    const a = el("a", { href: `org.html?code=${encodeURIComponent(c)}`, onclick: (e) => { e.preventDefault(); select(c, true); } }, tree.nodes[c].name);
    crumbs.append(i ? el("span", {}, a) : a);
  });
  document.getElementById("node-title").textContent = node.name;
  document.title = `${node.name} · Fed Pulse`;
  const badges = document.getElementById("badges");
  badges.innerHTML = "";
  badges.append(el("span", { class: "badge" }, node.level === "subelement" ? "sub-element" : node.level));
  if (node.group) badges.append(" ", el("a", { class: "badge", href: `agency.html?g=${encodeURIComponent(node.group)}` }, `agency overview: ${tree.groups[node.group]}`));
  if (node.last_seen && tree.latest && node.last_seen < tree.latest) badges.append(" ", el("span", { class: "badge warn" }, `not in OPM data since ${fmt.month(node.last_seen)}`));
  if (node.first_seen && months.datasets.employment[0] && node.first_seen > months.datasets.employment[0]) badges.append(" ", el("span", { class: "badge" }, `first seen ${fmt.month(node.first_seen)}`));

  const [series, mix, trend, geo] = await Promise.all([
    loadJSON(`data/slices/series/${code}.json`).catch(() => ({ months: months.datasets.employment, headcount: {}, accessions: {}, separations: {} })),
    loadJSON(`data/slices/mix/${code}.json`).catch(() => null),
    loadJSON(`data/slices/trend/${code}.json`).catch(() => null),
    loadJSON(`data/slices/geo/${code}.json`).catch(() => null),
  ]);
  if (mix?._summary?.disclosed_location_share != null) badges.append(" ", disclosureBadge(mix._summary.disclosed_location_share));

  const cards = document.getElementById("cards");
  cards.innerHTML = "";
  const card = (label, value, sub, cls = "") => cards.append(el("div", { class: "card" }, el("div", { class: "label" }, label), el("div", { class: "value " + cls }, value), sub ? el("div", { class: "sub" }, sub) : null));
  const latest = tree.latest, first = months.datasets.employment[0];
  const hNow = node.headcount?.[latest], hFirst = node.headcount?.[first];
  card("Headcount", fmt.int(hNow), fmt.month(latest));
  if (hNow != null && hFirst != null) card(`Since ${fmt.month(first)}`, fmt.signed(hNow - hFirst), fmt.pct((hNow - hFirst) / hFirst, 1), hNow - hFirst < 0 ? "neg" : "pos");
  const sumCats = (obj, skip) => Object.entries(obj || {}).filter(([m]) => m >= first).reduce((s, [, cats]) => s + Object.entries(cats).filter(([c]) => c !== skip).reduce((a, [, n]) => a + n, 0), 0);
  card("Accessions", fmt.int(sumCats(series.accessions)), `effective ${fmt.month(first)}+`);
  card("Separations", fmt.int(sumCats(series.separations, "DRP")), `effective ${fmt.month(first)}+`);

  const st = { metric: qs("metric", "headcount"), by: qs("by", "none"), mode: qs("mode", "count"), cmp: qs("cmp", ""), range: qs("range", "all") };
  trendPanel(document.getElementById("trend"), { code, name: node.name, tree, series, trend, codes, lookups, state: st, onState: (s) => setQs({ metric: s.metric === "headcount" ? null : s.metric, by: s.by === "none" ? null : s.by, mode: s.mode === "count" ? null : s.mode, cmp: s.cmp || null, range: s.range === "all" ? null : s.range }) });

  const flows = document.getElementById("flows");
  flows.innerHTML = "";
  flows.append(el("div", { class: "panel" }, el("h2", {}, "Hires and separations"), flowsChart(series, codes, { months: months.datasets.employment, title: `${node.name}` })));

  compositionPanel(document.getElementById("composition"), { mix, codes, lookups, state: { dim: qs("dim", "grade") }, onState: (s) => setQs({ dim: s.dim === "grade" ? null : s.dim }) });

  const emp = manifest.datasets?.employment?.[latest];
  const fileUrl = emp?.site_url || emp?.release_url;
  const orgPrefix = code === "gov" ? "" : code.startsWith("D:") ? null : code;
  mapPanel(document.getElementById("map"), {
    code, name: node.name, geo,
    loadGeo: async () => {
      if (geoCache.has(code)) return geoCache.get(code);
      if (!fileUrl || orgPrefix == null) throw new Error("no parquet available for this unit");
      const { runQuery } = await import("./js/query.js");
      const duty = await loadJSON("data/lookups/duty_station.json");
      const rows = await runQuery(`SELECT duty_station_code AS code, sum(n)::BIGINT AS n FROM read_parquet('${new URL(fileUrl, location.href).href}') WHERE org_code LIKE '${orgPrefix}%' GROUP BY 1`);
      const g = geoFromRows(rows.map((r) => [r.code, r.n]), duty, latest);
      geoCache.set(code, g);
      return g;
    },
    state: { level: qs("map", "county") }, onState: (s) => setQs({ map: s.level === "county" ? null : s.level }),
  });

  const note = document.getElementById("download-note");
  note.innerHTML = "";
  if (fileUrl) note.append(`Fact table for ${fmt.month(latest)}: `, el("a", { href: fileUrl }, emp.file), ` (${fmt.money(emp.parquet_bytes)}B parquet, ${fmt.int(emp.rows_fact)} rows). Filter on org_code starting with "${orgPrefix ?? ""}". `, el("a", { href: "data.html" }, "All months and the data dictionary."));
  else note.append(`Fact tables are published once a month. `, el("a", { href: "data.html" }, "See the data page."));
  const { filterPanel } = await import("./js/query.js");
  filterPanel(document.getElementById("query"), { fileUrl: fileUrl ? new URL(fileUrl, location.href).href : null, month: latest, orgCode: orgPrefix ?? "", lookups: { codes, series: series_lk, step: step_lk, duty_station: await loadJSON("data/lookups/duty_station.json").catch(() => ({})) } });
}

select(selected);
</script>
</body>
</html>
